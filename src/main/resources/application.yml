spring:
  application:
    name: albums-backend
  datasource:
    url: jdbc:h2:mem:albumsdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  servlet:
    context-path: /

app:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    root: INFO
    com.example.albums: DEBUG

